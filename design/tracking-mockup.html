<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loupe — Tracking</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
  :root{
    --bg:#EDEDED; --surface:#FFF; --ink:#0A0A0A; --ink-soft:#4A4A4E; --muted:#8E8E93;
    --chip:#F4F4F4; --r-card:24px; --r-pill:999px; --amber:#B8862B; --green:#2F7A4F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);
       color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
       padding:18px;height:100vh;overflow:hidden}
  .app{display:grid;grid-template-columns:216px 1fr;gap:18px;height:100%}

  .side{display:flex;flex-direction:column;gap:26px;padding:8px 4px 0;min-height:0}
  .brand{display:flex;align-items:center;gap:10px;padding:0 12px}
  .mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;
        display:grid;place-items:center;font-weight:600;font-size:14px}
  .brand span{font-weight:500;letter-spacing:-.01em}
  nav{display:flex;flex-direction:column;gap:4px}
  .nav-lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
           padding:0 14px;margin-bottom:8px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:var(--r-pill);
            color:var(--ink-soft);cursor:pointer;transition:.16s}
  .nav-item:hover{background:rgba(0,0,0,.045)}
  .nav-item.on{background:var(--ink);color:#fff;font-weight:500}
  .nav-item .ic{width:16px;height:16px;flex:none;opacity:.85}
  .nav-item .badge{margin-left:auto;background:var(--amber);color:#fff;font-size:10px;min-width:18px;
                   height:18px;border-radius:9px;display:grid;place-items:center;font-weight:600}
  .nav-item.on .badge{background:#fff;color:var(--ink)}
  .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;
      background:var(--surface);border-radius:var(--r-pill)}
  .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#C9C9CF,#8E8E93);flex:none}
  .me small{color:var(--muted);font-size:11px;display:block;line-height:1.2}

  .main{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
  .top{display:flex;align-items:center;gap:12px}
  h1{font-size:26px;font-weight:500;letter-spacing:-.025em}
  .date{color:var(--muted);font-size:12px;margin-left:2px}
  .stats{display:flex;gap:8px;margin-left:auto}
  .stat{background:var(--surface);border-radius:var(--r-pill);padding:8px 16px;
        display:flex;align-items:center;gap:9px}
  .stat b{font-size:15px;font-weight:600;letter-spacing:-.02em}
  .stat span{color:var(--muted);font-size:11px}
  .stat.dark{background:var(--ink);color:#fff}
  .stat.dark span{color:rgba(255,255,255,.6)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}

  .card{background:var(--surface);border-radius:var(--r-card);padding:20px;
        flex:1;min-height:0;display:flex;flex-direction:column}

  .bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .seg{display:flex;background:var(--chip);border-radius:var(--r-pill);padding:3px}
  .seg button{border:0;background:none;font:inherit;font-size:11.5px;color:var(--muted);
              padding:6px 14px;border-radius:var(--r-pill);cursor:pointer;display:flex;
              align-items:center;gap:6px}
  .seg button.on{background:var(--ink);color:#fff;font-weight:500}
  .seg .c{background:rgba(0,0,0,.08);border-radius:8px;padding:0 5px;font-size:10px}
  .seg button.on .c{background:rgba(255,255,255,.2)}
  .filt{margin-left:auto;display:flex;gap:6px}
  .sel{background:var(--chip);border:0;font:inherit;font-size:11.5px;color:var(--ink-soft);
       padding:7px 13px;border-radius:var(--r-pill);cursor:pointer}
  .srch{background:var(--chip);border:0;font:inherit;font-size:11.5px;padding:7px 15px;
        border-radius:var(--r-pill);width:150px;outline:none}

  .rows{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
  .rows::-webkit-scrollbar{width:5px}
  .rows::-webkit-scrollbar-thumb{background:#DDD;border-radius:3px}

  .row{border:1px solid #EFEFEF;border-radius:18px;padding:13px 15px;display:flex;
       gap:14px;align-items:flex-start;transition:.15s}
  .row:hover{border-color:#E0E0E0}
  .row.open{border-color:var(--ink)}
  .th{width:52px;height:52px;border-radius:13px;background:var(--chip);flex:none;
      position:relative;overflow:hidden}
  .th svg{position:absolute;inset:0;width:100%;height:100%}
  .body{flex:1;min-width:0}
  .l1{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .fn{font-weight:500;font-size:12.5px;font-family:ui-monospace,monospace}
  .pill{border-radius:var(--r-pill);padding:2px 9px;font-size:10px;font-weight:600;
        letter-spacing:.03em;text-transform:uppercase}
  .p-fail{background:#FAF2E4;color:var(--amber)}
  .p-stall{background:var(--chip);color:var(--muted)}
  .p-run{background:var(--ink);color:#fff}
  .age{color:var(--muted);font-size:11px;margin-left:auto;flex:none}
  .why{color:var(--ink-soft);font-size:12px}
  .why b{font-weight:500;color:var(--ink)}
  .acts{display:flex;gap:6px;margin-top:9px}
  .b{border:0;font:inherit;font-size:11px;padding:6px 13px;border-radius:var(--r-pill);
     cursor:pointer;background:var(--chip);color:var(--ink-soft)}
  .b.k{background:var(--ink);color:#fff;font-weight:500}
  .b:hover{filter:brightness(.97)}

  .tl{margin-top:12px;padding-top:12px;border-top:1px solid #F0F0F0;display:none}
  .row.open .tl{display:block}
  .tl-r{display:flex;gap:12px;font-size:11.5px;padding:3px 0;align-items:baseline}
  .tl-r time{color:var(--muted);font-family:ui-monospace,monospace;width:52px;flex:none}
  .tl-r .d{width:5px;height:5px;border-radius:50%;background:#D5D5D9;flex:none;
           position:relative;top:-2px}
  .tl-r.bad .d{background:var(--amber)}
  .tl-r.ok .d{background:var(--green)}
  .tl-r span{color:var(--ink-soft)}
  .raw{margin-top:9px;background:#FAFAFA;border-radius:11px;padding:9px 12px;
       font-family:ui-monospace,monospace;font-size:10.5px;color:var(--muted);overflow-x:auto}

  .foot{margin-top:12px;padding-top:13px;border-top:1px solid #F0F0F0;display:flex;
        align-items:center;gap:10px;font-size:11.5px;color:var(--muted)}
  .foot b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">L</div><span>Loupe</span></div>
    <nav>
      <div class="nav-lbl">Workspace</div>
      <div class="nav-item"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.5-4.5"/></svg>Console</div>
      <div class="nav-item on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>Tracking<span class="badge">3</span></div>
      <div class="nav-item"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h10M4 18h13"/></svg>Prompts</div>
      <div class="nav-item"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 17l5-5 4 3 5-7 4 5"/></svg>Reports</div>
      <div class="nav-lbl" style="margin-top:20px">Setup</div>
      <div class="nav-item"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>Settings</div>
    </nav>
    <div class="me"><div class="av"></div>
      <div><div style="font-weight:500;font-size:12px">Operator</div><small>qimati.in</small></div></div>
  </aside>

  <main class="main">
    <div class="top">
      <div><h1>Tracking</h1><div class="date">Monday, 28 July</div></div>
      <div class="stats">
        <div class="stat"><b>41</b><span>uploaded</span></div>
        <div class="stat"><b>17</b><span>listed</span></div>
        <div class="stat"><span class="dot"></span><b>3</b><span>need attention</span></div>
        <div class="stat dark"><b>21</b><span>in queue</span></div>
      </div>
    </div>

    <section class="card">
      <div class="bar">
        <div class="seg">
          <button class="on">Needs attention <span class="c">3</span></button>
          <button>In progress <span class="c">21</span></button>
          <button>All</button>
        </div>
        <div class="filt">
          <select class="sel"><option>Any status</option><option>Failed</option><option>Stalled</option></select>
          <select class="sel"><option>Any error</option><option>Unsupported format</option><option>Too large</option><option>Rate limited</option></select>
          <select class="sel"><option>Any age</option><option>Over 1 hour</option><option>Over 24 hours</option></select>
          <input class="srch" placeholder="Search filename">
        </div>
      </div>

      <div class="rows" id="rows"></div>

      <div class="foot">
        <span>Showing <b>3</b> of 41 files today</span>
        <span style="margin-left:auto">41 uploaded = 17 listed + 21 in progress + 3 need attention &nbsp;✓</span>
      </div>
    </section>
  </main>
</div>

<script>
const art = i => `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
 <defs><radialGradient id="r${i}" cx="42%" cy="34%"><stop offset="0%" stop-color="#fff"/>
 <stop offset="65%" stop-color="#F2F2F2"/><stop offset="100%" stop-color="#E2E2E4"/></radialGradient></defs>
 <rect width="100" height="100" fill="url(#r${i})"/>
 ${i%2 ? `<ellipse cx="50" cy="52" rx="20" ry="20" fill="none" stroke="#C6C6CC" stroke-width="2.6"/>`
        : `<path d="M26 38 Q50 74 74 38" fill="none" stroke="#C6C6CC" stroke-width="2.6" stroke-linecap="round"/>`}
</svg>`;

const data = [
  { f:'IMG_1847.HEIC', s:'fail', sl:'Failed', age:'2h ago',
    why:'<b>The file is a HEIC.</b> The enhancer needs JPEG or PNG. Ask the photographer to change the camera setting to Most Compatible.',
    acts:['Retry','Retry with prompt…','Open in Drive','Skip'],
    raw:'photoroom.api → 415 UNSUPPORTED_MEDIA_TYPE (permanent — no retries attempted)',
    tl:[['10:04','Discovered in RAW IMAGES',''],['10:04','Classified as permanent error — retries skipped','bad']] },

  { f:'IMG_1902.jpg', s:'fail', sl:'Failed', age:'40m ago',
    why:'<b>Image is 24 MB, over the 20 MB limit.</b> Resize and re-upload, or shoot at a lower resolution.',
    acts:['Retry','Open in Drive','Skip'],
    raw:'openai.images.edit → 413 PAYLOAD_TOO_LARGE (permanent)',
    tl:[['11:22','Discovered in RAW IMAGES',''],['11:22','Rejected before enhancement','bad']] },

  { f:'IMG_1855.jpg', s:'stall', sl:'Stalled', age:'3 days ago',
    why:'<b>Enhanced but never grouped into a product.</b> Nothing is wrong with it — it looks like it was forgotten in the queue.',
    acts:['Open in console','Skip'],
    raw:'status = enhanced · grouped_at = null · age = 71h',
    tl:[['Fri 09:12','Discovered in RAW IMAGES',''],['Fri 09:13','Enhanced — v1 selected','ok'],
        ['—','Waiting to be grouped for 71 hours','bad']] },
];

document.getElementById('rows').innerHTML = data.map((d,i)=>`
 <div class="row ${i===0?'open':''}" data-i="${i}">
   <div class="th">${art(i)}</div>
   <div class="body">
     <div class="l1">
       <span class="fn">${d.f}</span>
       <span class="pill ${d.s==='fail'?'p-fail':'p-stall'}">${d.sl}</span>
       <span class="age">${d.age}</span>
     </div>
     <div class="why">${d.why}</div>
     <div class="acts">
       ${d.acts.map((a,j)=>`<button class="b ${j===0?'k':''}">${a}</button>`).join('')}
       <button class="b tog" style="margin-left:auto">Details ▾</button>
     </div>
     <div class="tl">
       ${d.tl.map(([t,x,c])=>`<div class="tl-r ${c}"><time>${t}</time><i class="d"></i><span>${x}</span></div>`).join('')}
       <div class="raw">${d.raw}</div>
     </div>
   </div>
 </div>`).join('');

document.querySelectorAll('.tog').forEach(b =>
  b.onclick = e => e.target.closest('.row').classList.toggle('open'));
</script>
</body>
</html>
