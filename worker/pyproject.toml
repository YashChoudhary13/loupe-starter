[project]
name = "loupe-worker"
version = "0.1.0"
description = "Loupe's vision worker: syncs originals to local disk, embeds references and identification queries with SigLIP2 + u2net, posts results back to Loupe."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "timm>=1.0.15",
  "safetensors>=0.4",
  "rembg==2.0.78",
  "onnxruntime>=1.18; sys_platform != 'win32'",
  "onnxruntime-gpu>=1.18; sys_platform == 'win32'",
  "pooch", "pymatting",
  "pillow>=10",
  "numpy>=1.26",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.scripts]
loupe-worker = "loupe_worker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loupe_worker*"]
