# Installed to /etc/nginx/sites-available/loupe by scripts/deploy.sh on every deploy.
# TLS: Let's Encrypt via certbot (webroot /var/www/html); renewal is certbot's timer.
# One certificate lineage, `loupe.qimati-eng.site`, expanded to all four names (D136):
#   sudo certbot certonly --webroot -w /var/www/html --cert-name loupe.qimati-eng.site --expand \
#     -d loupe.qimati-eng.site -d qimati-eng.site -d qc.qimati-eng.site -d ship.qimati-eng.site
# so the ssl_certificate paths below never change.
server {
    server_name qimati-eng.site qc.qimati-eng.site ship.qimati-eng.site loupe.qimati-eng.site;

    # Photos go browser -> R2 on presigned URLs, so request bodies here are small;
    # this only has to clear server-action payloads and worker JSON.
    client_max_body_size 50m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # /api/cron/enhance may run for up to 285 s per tick.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://127.0.0.1:3000;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/loupe.qimati-eng.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loupe.qimati-eng.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name qimati-eng.site qc.qimati-eng.site ship.qimati-eng.site loupe.qimati-eng.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
